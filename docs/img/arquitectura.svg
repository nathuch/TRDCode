<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Arquitectura de TRDCode</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6459"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#ffffff"/>

  <!-- Navegador -->
  <rect x="20" y="20" width="300" height="190" rx="10" fill="#e8f3e0" stroke="#2f7a0a" stroke-width="1.5"/>
  <text x="36" y="46" font-weight="700" font-size="15" fill="#2f7a0a">Navegador (computador o celular)</text>
  <text x="36" y="72" fill="#1b1f1a">Frontend compilado: React 19 + Vite</text>
  <text x="36" y="94" fill="#1b1f1a">• Consulta, filtros, ficha (cruce en el navegador)</text>
  <text x="36" y="114" fill="#1b1f1a">• Lee el Excel del reporte (SheetJS)</text>
  <text x="36" y="134" fill="#1b1f1a">• Exporta Excel (SheetJS) y PDF (jsPDF)</text>
  <text x="36" y="154" fill="#1b1f1a">• Cierre por inactividad (29 min)</text>
  <text x="36" y="186" fill="#5b6459" font-size="12">Rutas relativas: funciona en cualquier carpeta</text>

  <!-- Servidor web -->
  <rect x="380" y="20" width="460" height="300" rx="10" fill="#f5f7f4" stroke="#5b6459" stroke-width="1.5"/>
  <text x="396" y="46" font-weight="700" font-size="15" fill="#1b1f1a">Servidor web (Apache o Nginx) + PHP 8.1 o más nuevo</text>

  <rect x="396" y="62" width="200" height="104" rx="8" fill="#ffffff" stroke="#c9d0c6"/>
  <text x="410" y="84" font-weight="600" fill="#1b1f1a">Carpeta pública (app/)</text>
  <text x="410" y="106" fill="#1b1f1a">index.html, assets/</text>
  <text x="410" y="126" fill="#1b1f1a">robots.txt, .htaccess</text>
  <text x="410" y="146" fill="#5b6459" font-size="12">consola/ bloqueada (403)</text>

  <rect x="612" y="62" width="212" height="164" rx="8" fill="#ffffff" stroke="#c9d0c6"/>
  <text x="626" y="84" font-weight="600" fill="#1b1f1a">API en PHP (api/*.php)</text>
  <text x="626" y="106" fill="#1b1f1a">JSON, sin framework</text>
  <text x="626" y="126" fill="#1b1f1a">PDO con consultas preparadas</text>
  <text x="626" y="146" fill="#1b1f1a">Sesión + token CSRF</text>
  <text x="626" y="166" fill="#1b1f1a">Nombres IPC/IPR ocultos</text>
  <text x="626" y="186" fill="#1b1f1a">sin sesión</text>
  <text x="626" y="210" fill="#5b6459" font-size="12">api/lib/ bloqueada (403)</text>

  <rect x="396" y="182" width="200" height="120" rx="8" fill="#fff8e6" stroke="#ebcb7a"/>
  <text x="410" y="204" font-weight="600" fill="#1b1f1a">.env FUERA de la</text>
  <text x="410" y="222" font-weight="600" fill="#1b1f1a">carpeta pública</text>
  <text x="410" y="246" fill="#1b1f1a">Base, usuario, clave</text>
  <text x="410" y="266" fill="#5b6459" font-size="12">Ruta en TRDCODE_ENV o</text>
  <text x="410" y="284" fill="#5b6459" font-size="12">junto a la raíz web</text>

  <!-- Base de datos -->
  <rect x="612" y="350" width="228" height="100" rx="10" fill="#e8eef8" stroke="#3d63a8" stroke-width="1.5"/>
  <text x="626" y="376" font-weight="700" font-size="15" fill="#3d63a8">MySQL 5.7+ / MariaDB 10.4+</text>
  <text x="626" y="400" fill="#1b1f1a">8 tablas, utf8mb4_unicode_ci</text>
  <text x="626" y="420" fill="#1b1f1a">Usuario propio: SELECT, INSERT,</text>
  <text x="626" y="438" fill="#1b1f1a">UPDATE y DELETE</text>

  <!-- Fuentes de datos -->
  <rect x="20" y="260" width="300" height="80" rx="10" fill="#ffffff" stroke="#c9d0c6"/>
  <text x="36" y="286" font-weight="700" fill="#1b1f1a">Reporte Tolima de OnBase (.xlsx)</text>
  <text x="36" y="308" fill="#1b1f1a">Cada mes, desde "Actualizar datos"</text>
  <text x="36" y="326" fill="#5b6459" font-size="12">Se lee en el navegador; no se sube el archivo</text>

  <rect x="20" y="370" width="300" height="80" rx="10" fill="#ffffff" stroke="#c9d0c6"/>
  <text x="36" y="396" font-weight="700" fill="#1b1f1a">PDF de las TRD 2020 y 2025</text>
  <text x="36" y="418" fill="#1b1f1a">Python + pdfplumber (solo desarrollo)</text>
  <text x="36" y="436" fill="#5b6459" font-size="12">Genera database/trd.sql</text>

  <!-- Flechas -->
  <line x1="320" y1="90" x2="394" y2="100" stroke="#5b6459" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="326" y="80" fill="#5b6459" font-size="12">HTTPS</text>
  <line x1="320" y1="150" x2="610" y2="150" stroke="#5b6459" stroke-width="1.5" marker-end="url(#flecha)" marker-start="url(#flecha)"/>
  <text x="330" y="168" fill="#5b6459" font-size="12">fetch('api/…') JSON</text>
  <line x1="718" y1="226" x2="718" y2="348" stroke="#5b6459" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="726" y="300" fill="#5b6459" font-size="12">PDO</text>
  <line x1="596" y1="250" x2="642" y2="250" stroke="#5b6459" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#flecha)"/>
  <line x1="170" y1="260" x2="170" y2="212" stroke="#5b6459" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="320" y1="410" x2="610" y2="410" stroke="#5b6459" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#flecha)"/>
  <text x="380" y="402" fill="#5b6459" font-size="12">trd.sql (al instalar)</text>
</svg>
